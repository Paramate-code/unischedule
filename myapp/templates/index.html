<!DOCTYPE html>
<html lang="th">
<head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ระบบบริหารสถานศึกษา</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    </head>
  <style>
    body {
      background-color: #eeeeee;
      font-family: 'Sarabun', sans-serif;
    }

    .content-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .box-system {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
      height: 100%;
    }

    .box-system:hover {
      transform: translateY(-5px);
    }

    .box-system img {
      height: 70px;
      margin-bottom: 10px;
    }

    .box-text {
      font-weight: 500;
      font-size: 1rem;
      color: #000000;
    }

    .box-news {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      height: 100%;
    }

    .box-news td {
      padding: 6px 0;
      font-size: 0.95rem;
    }

    .box-news a {
      text-decoration: none;
      color: #0d6efd;
    }

    .box-news a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #cc0079;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#" style="color: white;">ระบบบริหารงานวิชาการของสถานศึกษา</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
      
          <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">หน้าแรก</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#services">ระบบผู้ใช้งาน</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#news">ข่าวสาร</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#contact">ติดต่อเรา</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <div class="container py-5">
        <div class="bg-white rounded shadow p-4">
          <div class="row g-4">
            <!-- ฝั่งซ้าย: กล่องระบบผู้ใช้งาน -->
            <div class="col-md-6">
              <div class="content-title">งานบริการของระบบงาน</div>
              <p class="text-muted">
                ระบบบริหารงานวิชาการของสถานศึกษา 
              </p>
              <div class="row g-3">
                <div class="col-6">
                  <a href="{% url 'loginstaff' %}" class="text-decoration-none text-dark">
                    <div class="box-system">
                      <img src="https://std2018.vec.go.th/web/vec/ui/img/icons/i_officer.png" alt="เจ้าหน้าที่">
                      <div class="box-text">กลุ่มบุคลากร / เจ้าหน้าที่</div>
                    </div>
                  </a>
                </div>
                <div class="col-6">
                  <a href="{% url 'login' %}" class="text-decoration-none text-dark">
                    <div class="box-system">
                      <img src="https://std2018.vec.go.th/web/vec/ui/img/icons/i_company.png" alt="นักเรียน">
                      <div class="box-text">กลุ่มนักเรียน / อาจารย์</div>
                    </div>
                  </a>
                </div>
              </div> <!-- ปิด row g-3 -->
            </div> <!-- ปิด col-md-6 ฝั่งซ้าย -->
      
            <!-- ฝั่งขวา: ข่าวสาร -->
            <div class="col-md-6">
              <div class="box-news h-100">
                <div class="content-title d-flex align-items-center">
                  <img src="https://st2.depositphotos.com/6789684/12262/v/450/depositphotos_122620866-stock-illustration-illustration-of-flat-icon.jpg" alt="megaphone" height="24" class="me-2">
                  ข่าวสารประชาสัมพันธ์
                </div>
                <table class="w-100 mt-3">
                  <tr>
                    <td width="100">[<span style="color:#d36300;">01 มิ.ย. 63</span>]</td>
                    <td><a href="https://www.spu.ac.th/" onclick="submitFormInit('65')">มหาลัยศรีปทุม</a></td>
                  </tr>
                  <tr>
                    <td>[<span style="color:#d36300;">01 พ.ค. 66</span>]</td>
                    <td><a href="https://www.spu.ac.th/fac/informatics/" onclick="submitFormInit('102')">คณะเทคโนโลยีสารสนเทศ</a></td>
                  </tr>
                </table>
              </div>
            </div> <!-- ปิด col-md-6 ฝั่งขวา -->
            
          </div> <!-- ปิด row g-4 -->
        </div> <!-- ปิด bg-white -->
      </div> <!-- ปิด container -->
</body>
</html>
