<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สมัครสมาชิกสำเร็จ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e0f7fa, #ffffff);
            font-family: 'Prompt', sans-serif;
        }

        .success-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background-color: #ffffff;
        }

        .success-icon {
            font-size: 4rem;
            color: #28a745;
        }
    </style>
    <!-- Google Font (optional for modern look) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
</head>
<body>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="col-md-8 col-lg-6">
        <div class="card success-card text-center p-4">
            <div class="card-body">
                <div class="success-icon mb-3">
                    ✅
                </div>
                <h3 class="card-title text-success mb-3">สำเร็จ!</h3>
                <p class="lead mb-4">นำเข้าระบบเรียบร้อย  {{ full_name }}</p>
                <hr>
                <p><strong>รหัสประจำตัว:</strong> {{ student_id }}</p>
                <p><strong>ชื่อ นามสกุล:</strong> {{ full_name }}</p>
                <a href="{% url 'index' %}" class="btn btn-success mt-4">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
