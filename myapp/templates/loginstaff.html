{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Staff Login</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{% static '/images/icons/favicon.ico' %}"/>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="{% static '/vendor/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static '/fonts/font-awesome-4.7.0/css/font-awesome.min.css' %}">
  <link rel="stylesheet" href="{% static '/fonts/Linearicons-Free-v1.0.0/icon-font.min.css' %}">
  <link rel="stylesheet" href="{% static '/vendor/animate/animate.css' %}">
  <link rel="stylesheet" href="{% static '/vendor/animsition/css/animsition.min.css' %}">
  <link rel="stylesheet" href="{% static '/vendor/select2/select2.min.css' %}">
  <link rel="stylesheet" href="{% static '/vendor/daterangepicker/daterangepicker.css' %}">

  <!-- Main CSS -->
  <link rel="stylesheet" href="{% static '/css/util.css' %}">
  <link rel="stylesheet" href="{% static '/css/main1.css' %}">

  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
    }

    .wrap-login100 {
      background-color: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .login100-form-title {
      background: linear-gradient(135deg, #000000, #434343);
      color: white;
      padding: 40px 15px;
      text-align: center;
      font-size: 28px;
      border-radius: 12px 12px 0 0;
    }

    .wrap-input100 {
      position: relative;
    }

    .wrap-input100 i {
      position: absolute;
      top: 12px;
      left: 15px;
      color: #888;
    }

    .wrap-input100 input {
      background-color: #2a2a2a;
      color: #fff;
      padding-left: 40px;
      border: none;
      border-radius: 8px;
    }

    .login100-form-btn {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      transition: 0.3s ease;
    }

    .login100-form-btn:hover {
      background: #555;
    }

    .message-error {
      color: #f44336;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="limiter">
  <div class="container-login100">
    <div class="wrap-login100">

      <!-- Header -->
      <div class="login100-form-title">
        <span class="login100-form-title-1">เจ้าหน้าที่</span>
      </div>

      <!-- Form -->
      <form class="login100-form validate-form p-4" method="POST" action="{% url 'loginstaff' %}">
        {% csrf_token %}
        {% for message in messages %}
          <p class="message-error">{{ message }}</p>
        {% endfor %}

        <!-- Username -->
        <div class="wrap-input100 validate-input m-b-26" data-validate="Username is required">
          <i class="fa fa-user"></i>
          <span class="label-input100">Username</span>
          <input class="input100" type="text" name="student_id" placeholder="กรอกชื่อผู้ใช้" required>
          <span class="focus-input100"></span>
        </div>

        <!-- Password -->
        <div class="wrap-input100 validate-input m-b-18" data-validate="Password is required">
          <i class="fa fa-lock"></i>
          <span class="label-input100">Password</span>
          <input class="input100" type="password" name="password" placeholder="กรอกรหัสผ่าน" required>
          <span class="focus-input100"></span>
        </div>

        <!-- Submit Button -->
        <div class="container-login100-form-btn mt-4">
          <button class="login100-form-btn w-100">เข้าสู่ระบบ</button>
        </div>
      </form>

    </div>
  </div>
</div>

<!-- Scripts -->
<script src="{% static '/vendor/jquery/jquery-3.2.1.min.js' %}"></script>
<script src="{% static '/vendor/animsition/js/animsition.min.js' %}"></script>
<script src="{% static '/vendor/bootstrap/js/popper.js' %}"></script>
<script src="{% static '/vendor/bootstrap/js/bootstrap.min.js' %}"></script>
<script src="{% static '/vendor/select2/select2.min.js' %}"></script>
<script src="{% static '/vendor/daterangepicker/moment.min.js' %}"></script>
<script src="{% static '/vendor/daterangepicker/daterangepicker.js' %}"></script>
<script src="{% static '/vendor/countdowntime/countdowntime.js' %}"></script>
<script src="{% static '/js/main.js' %}"></script>

</body>
</html>
